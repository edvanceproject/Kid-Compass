  - id: vitm
    name: Visvesvaraya Industrial & Technological Museum (VITM)
    type: science museum
    interests: [science, engineering, innovation, space, quiz]
    ages: null
    look_for: Science demonstration shows, Taramandal and 3D shows, sky-observation programmes, popular science lectures, the annual Bengaluru district science quiz, children's galleries
    cost: low
    area: Kasturba Road, Cubbon Park
    url: https://www.vismuseum.gov.in/
    events_url: https://www.vismuseum.gov.in/upcoming-events.php
    notes: Entry ₹100 per person above age 5 (official ticket page); shows charged separately. Events page sometimes doesn't load — call or visit if so.
  - id: jawaharlal-nehru-planetarium
    name: Jawaharlal Nehru Planetarium (BASE)
    type: planetarium
    interests: [space, science]
    ages: null
    look_for: Daily sky-theatre shows in English and Kannada, monthly first-Sunday sky-watching, weekend science sessions, holiday camps, REAP programme for students
    cost: low
    area: High Grounds, Sri T. Chowdiah Road
    url: https://www.taralaya.org/
    events_url: null
    notes: Run by the Bangalore Association for Science Education. Programme details come from Karnataka Tourism listings; the official site couldn't be checked automatically and some listings give taralaya.karnataka.gov.in instead.
  - id: science-gallery-bengaluru
    name: Science Gallery Bengaluru
    type: science museum
    interests: [science, innovation, art, environment]
