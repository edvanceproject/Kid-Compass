id: inspire-manak
name: INSPIRE Awards – MANAK
organiser: Department of Science & Technology (DST), Government of India
interests: [science, innovation, engineering]
format: Child proposes an original idea that solves an everyday problem; shortlisted students build a model and exhibit it
level_path: [school, district, state, national]
eligibility:
  class_min: 6
  class_max: 12
  age_min: null
  age_max: null
  age_as_of: null
  boards: all recognised schools
  team: individual
  details: Open to Classes 6–12 (students in Classes 11–12 must be in the science stream); each school can send up to 5 ideas a year, at most 2 from Classes 11–12
apply_via: school
cost_inr: 0
reward: ₹10,000 (by DBT) to each of about 1 lakh shortlisted students, then district, state and national exhibitions
window:
  opens_month: 7
  closes_month: 9
  last_seen_open: 2026-07-15
  last_seen_close: 2026-09-15
  event_months: null
  cycle: annual
credibility: official
official_url: https://inspireawards-dst.gov.in
source_urls:
  - https://inspireawards-dst.gov.in/Download/Nomination_Open_Inspire_Manak_2026-27.pdf
