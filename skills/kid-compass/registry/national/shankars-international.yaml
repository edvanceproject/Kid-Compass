id: shankars-international
name: Shankar's International Children's Competition
organiser: Children's Book Trust, New Delhi
interests: [art, writing]
format: Child posts an original, unaided painting or drawing, or emails/posts a piece of English writing (poem, story, essay, play); an international jury judges
level_path: [international]
eligibility:
  class_min: null
  class_max: null
  age_min: null
