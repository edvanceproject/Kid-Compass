notes: >-
  Standing rule: Indian entries by 31 October. A 2026 cycle could not be confirmed (the rules page carries no year), so
  check the site before sending. Schools can also send entries. Children's Book Trust also runs Shankar's On-the-Spot
  Painting Competition in New Delhi each autumn (free, ages 5–17).
