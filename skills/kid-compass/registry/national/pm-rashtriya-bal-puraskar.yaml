id: pm-rashtriya-bal-puraskar
name: Pradhan Mantri Rashtriya Bal Puraskar (PMRBP)
organiser: Ministry of Women and Child Development, Government of India
interests: [all-round, social-impact, environment, sports, art, science, innovation]
format: Online nomination for an exceptional achievement in one of six categories — Bravery, Social Service, Environment, Sports, Art & Culture, Science & Technology; a national committee selects
level_path: [national]
eligibility:
  class_min: null
  class_max: null
  age_min: 5
  age_max: 18
  age_as_of: 31 July of the award year
  boards: all — Indian citizens living in India
  team: individual
  details: Above 5 and not over 18 as on 31 July; for exceptional, documented achievement, not participation
apply_via: self
cost_inr: 0
reward: Conferred by the President of India — medal, certificate and citation
window:
  opens_month: 4
  closes_month: 7
  last_seen_open: 2026-04-01
  last_seen_close: 2026-07-31
  event_months: Dec (26 December in 2024 and 2025)
  cycle: annual
credibility: official
official_url: https://awards.gov.in
source_urls:
  - https://awards.gov.in
  - https://newsonair.gov.in/nominations-for-pradhan-mantri-rashtriya-bal-puraskar-2026-open-till-july-31/
  - https://ianslive.in/online-nominations-for-pradhan-mantri-rashtriya-bal-puraskar-2026-to-close-on-aug-15--20260731163602
  - https://newindiasamachar.pib.gov.in/WriteReadData/flipbook/2026/Jan/2nd/English/files/basic-html/page50.html
last_verified: 2026-11-01
notes: >-
  Anyone — the child, a parent, school or any citizen — can nominate on awards.gov.in. The 2026 deadline of 31 Jul was
  extended to 15 Aug (per IANS). Only suggest this when the child has a genuinely exceptional, evidenced achievement.
