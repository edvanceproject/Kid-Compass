notes: >-
  The school registers and pays (₹3,000 per school, covering up to 2 teams) — free for the family. 2026-27 dates
  (27 Oct – 14 Nov 2026) come from news reports; the official circular Acad-69/2026 is listed on the portal but
  couldn't be opened, so confirm there. In 2025-26 registration ran in September, so the month moves year to year.
